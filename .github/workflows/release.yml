# Публикация AIGuiders.* Core на nuget.org через Trusted Publishing (OIDC).
# nuget.org (LonelySoul): Trusted Publishing → owner AI-Guiders, repo guiders-core, workflow release.yml
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test (exclude shell integration)
        run: dotnet test -c Release --filter "FullyQualifiedName!~ShellHabitatTests"

      - name: Pack all ship packages
        run: dotnet pack -c Release --output ./artifacts

      - name: NuGet login (OIDC → временный API key)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: LonelySoul

      - name: Push nupkg / snupkg
        shell: bash
        run: |
          set -euo pipefail
          key="${{ steps.nuget_login.outputs.NUGET_API_KEY }}"
          src="https://api.nuget.org/v3/index.json"
          shopt -s nullglob

          # nuget.org validates snupkg PDB hashes against the *published* nupkg.
          # With --skip-duplicate, unchanged nupkg versions are skipped but snupkg
          # would still upload fresh PDBs → validation failure (NuGet/Home#10475).
          push_nupkg() {
            local pkg="$1"
            local log
            if ! log=$(dotnet nuget push "$pkg" --api-key "$key" --source "$src" --skip-duplicate 2>&1); then
              echo "$log"
              return 1
            fi
            echo "$log"
            if echo "$log" | grep -qiE 'already exists|already been pushed|was not pushed'; then
              return 2
            fi
            return 0
          }

          for f in artifacts/AIGuiders.*.nupkg; do
            echo "=== $f ==="
            rc=0
            push_nupkg "$f" || rc=$?
            if [[ $rc -eq 1 ]]; then
              exit 1
            fi
            if [[ $rc -eq 2 ]]; then
              echo "skip snupkg (nupkg duplicate): ${f%.nupkg}.snupkg"
              continue
            fi
            sym="${f%.nupkg}.snupkg"
            if [[ -f "$sym" ]]; then
              echo "push $sym"
              dotnet nuget push "$sym" --api-key "$key" --source "$src" --skip-duplicate
            fi
          done

# Публикация AIGuiders.* Core на nuget.org через Trusted Publishing (OIDC).
# nuget.org (LonelySoul): Trusted Publishing → owner AI-Guiders, repo guiders-core, workflow release.yml
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test (exclude shell integration)
        run: dotnet test -c Release --filter "FullyQualifiedName!~ShellHabitatTests"

      - name: Pack all ship packages
        run: dotnet pack -c Release --output ./artifacts

      - name: NuGet login (OIDC → временный API key)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: LonelySoul

      - name: Push nupkg / snupkg
        shell: bash
        run: |
          set -euo pipefail
          key="${{ steps.nuget_login.outputs.NUGET_API_KEY }}"
          src="https://api.nuget.org/v3/index.json"
          shopt -s nullglob
          for f in artifacts/AIGuiders.*.nupkg; do
            echo "push $f"
            dotnet nuget push "$f" --api-key "$key" --source "$src" --skip-duplicate
          done
          declare -A seen=()
          for f in artifacts/AIGuiders.*.snupkg; do
            base=$(basename "$f")
            if [[ -n "${seen[$base]:-}" ]]; then continue; fi
            seen[$base]=1
            dotnet nuget push "$f" --api-key "$key" --source "$src" --skip-duplicate
          done

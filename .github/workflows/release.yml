# Публикация AIGuiders.* Core на nuget.org через Trusted Publishing (OIDC).
# nuget.org (LonelySoul): TP → Package owner AIGuiders, repo guiders-core, workflow release.yml
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test (exclude shell integration)
        run: dotnet test -c Release --filter "FullyQualifiedName!~ShellHabitatTests"

      - name: Pack all ship packages
        run: dotnet pack -c Release --output ./artifacts

      - name: NuGet login (OIDC → временный API key)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: LonelySoul

      - name: Push nupkg / snupkg
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: bash scripts/nuget/push-artifacts.sh 'artifacts/AIGuiders.*.nupkg'
